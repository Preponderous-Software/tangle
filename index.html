<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tangle</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2712%27 fill=%27%2316191d%27/%3E%3Cpath d=%27M32 9 57 53H7Z%27 fill=%27none%27 stroke=%27%23d6a75a%27 stroke-width=%278%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<style>
  :root { --ink: #1d1f24; --paper: #efe9dd; --gold: #d6a75a; --teal: #2aa6aa; --night: #0d0f12; --glass: rgba(13,15,18,.78);
    --serif: Georgia, "Times New Roman", serif; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  [hidden] { display: none !important; }
  html { font-size: calc(16px * var(--ui, 1)); }
  html, body { margin: 0; height: 100%; background: var(--night); color: #ece6da; overflow: hidden; font: 400 1rem/1.5 var(--serif); }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  .hud { position: fixed; pointer-events: none; }
  #objective { top: max(14px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); max-width: min(30rem, 62vw);
    font: 600 .82rem/1.4 var(--mono); letter-spacing: .02em; background: var(--glass); padding: .5rem .7rem; border-left: 3px solid var(--gold);
    transition: background .4s; }
  #objective.fresh { background: rgba(214,167,90,.35); }
  #objective::before { content: "NEXT  "; color: var(--gold); }
  #caption { left: 50%; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 3.6rem); transform: translateX(-50%);
    width: min(40rem, calc(100vw - 32px)); box-sizing: border-box; text-align: center; font-size: 1.05rem; background: var(--glass); padding: .6rem .9rem;
    transition: opacity .35s; }
  #caption.out { opacity: 0; }
  #prompt { left: 50%; top: calc(50% + 30px); transform: translateX(-50%); font: 600 .82rem/1 var(--mono);
    background: var(--glass); padding: .45rem .6rem; border: 1px solid var(--gold); white-space: nowrap; }
  #cross { left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; }
  #cross circle { fill: none; transition: stroke .15s; }
  #cross .dot { fill: rgba(255,255,255,.9); stroke: rgba(0,0,0,.5); stroke-width: 1.2; }
  #cross .ring { stroke: transparent; stroke-width: 2; }
  #cross.active .ring { stroke: var(--gold); }
  #cross .fill { stroke: var(--gold); stroke-width: 3; stroke-dasharray: 69.1; stroke-dashoffset: 69.1; transform: rotate(-90deg); transform-origin: 15px 15px; }
  #flash { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(255,214,140,.0) 30%, rgba(255,200,110,.55)); opacity: 0; transition: opacity 1.6s ease-out; }
  #flash.on { opacity: 1; transition: opacity .12s; }
  #menubtn { position: fixed; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); width: 42px; height: 42px;
    border-radius: 50%; border: 1px solid rgba(255,255,255,.3); background: var(--glass); color: #ece6da; font: 600 18px/1 var(--mono); cursor: pointer; }

  /* full-screen cards: the title, the pause menu, the debrief */
  .veil { position: fixed; inset: 0; display: flex; padding: 16px; box-sizing: border-box; overflow: auto; }
  .veil > * { margin: auto; }
  .card { width: min(36rem, 100%); background: var(--paper); color: var(--ink); padding: 1.5rem 1.6rem 1.3rem; border-top: 5px solid var(--gold);
    box-sizing: border-box; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .card h2 { margin: 0 0 .6rem; font-size: 1.6rem; line-height: 1.15; }
  .card h3 { margin: 1rem 0 .25rem; font: 600 .72rem/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: #6a6256; }
  .card p { margin: 0; }
  .row { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1.2rem; align-items: center; }
  .card button, #title button { font: 600 .85rem/1 var(--mono); background: var(--ink); color: var(--paper); border: 0; padding: .75rem 1.05rem; cursor: pointer; }
  .card button.quiet, #title button.quiet { background: transparent; color: inherit; border: 1px solid currentColor; }
  .card button.danger { background: #8e2b20; color: #fff; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
  #panel { background: rgba(6,7,9,.5); }
  #menu { background: rgba(6,7,9,.6); }
  .set { display: grid; grid-template-columns: 10rem 1fr; gap: .55rem 1rem; align-items: center; margin-top: .6rem; font-size: .95rem; }
  .set input[type=range] { width: 100%; accent-color: var(--ink); }
  .set select { font: inherit; padding: .2rem .3rem; justify-self: start; }
  .set input[type=checkbox] { width: 1.1rem; height: 1.1rem; accent-color: var(--ink); justify-self: start; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: .25rem 1rem; font-size: .95rem; margin-top: .3rem; }
  .keys kbd { font: 600 .78rem/1.5 var(--mono); background: #e2dacb; border: 1px solid #b9ae9b; border-bottom-width: 2px; padding: 0 .35rem; white-space: nowrap; }

  #title { background: rgba(10,12,15,.84); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: #ece6da; }
  #title .inner { width: min(34rem, 100%); }
  #title h1 { font: 700 clamp(3rem, 11vw, 5.5rem)/0.95 var(--serif); margin: 0; letter-spacing: -.01em; }
  #title h1 span { color: var(--gold); }
  #title .sub { font-size: 1.2rem; color: #c9c1b3; margin: .6rem 0 0; }
  #title .how { font-size: 1rem; color: #ddd5c6; border-top: 1px solid rgba(255,255,255,.18); padding-top: 1rem; margin-top: 1.4rem; }
  #title .how b { color: var(--gold); font-weight: 600; }
  #title button { background: var(--gold); color: var(--ink); font-size: .95rem; padding: .9rem 1.4rem; }
  #title button.quiet { color: #ece6da; background: transparent; }

  #stick, #use { display: none; }
  body.touch #stick { display: block; position: fixed; left: max(20px, env(safe-area-inset-left)); bottom: max(24px, env(safe-area-inset-bottom));
    width: 128px; height: 128px; border-radius: 50%; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.25); touch-action: none; }
  #knob { position: absolute; left: 39px; top: 39px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.4); pointer-events: none; }
  body.touch #use { display: block; position: fixed; right: max(22px, env(safe-area-inset-right)); bottom: max(40px, env(safe-area-inset-bottom));
    width: 86px; height: 86px; border-radius: 50%; border: 2px solid var(--gold); background: var(--glass); color: #ece6da; font: 600 15px/1 var(--mono); }
  body.touch #use.ready { background: rgba(214,167,90,.55); }
  body.touch #caption { bottom: auto; top: calc(max(14px, env(safe-area-inset-top)) + 3.2rem); }
  body:not(.touch) #menubtn { display: none; }
  body.carded #caption, body.carded #cross, body.carded #prompt, body.carded #stick, body.carded #use, body.carded #menubtn { visibility: hidden; }
  @media (max-height: 520px) {
    .card { padding: .9rem 1.1rem .8rem; } .card h2 { font-size: 1.25rem; margin-bottom: .3rem; } .card h3 { margin-top: .55rem; }
    .row { margin-top: .7rem; } .set { gap: .3rem 1rem; margin-top: .3rem; } #title h1 { font-size: 2.8rem; } #title .how { margin-top: .8rem; padding-top: .6rem; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body class="carded">
<canvas id="view" tabindex="0" aria-label="Tangle, a first-person game about strange loops"></canvas>
<div id="flash"></div>
<div class="hud" id="objective" hidden></div>
<svg class="hud" id="cross" viewBox="0 0 30 30" aria-hidden="true">
  <circle class="ring" cx="15" cy="15" r="10"></circle>
  <circle class="fill" cx="15" cy="15" r="11"></circle>
  <circle class="dot" cx="15" cy="15" r="2.6"></circle>
</svg>
<div class="hud" id="prompt" hidden></div>
<div class="hud" id="caption" hidden></div>
<div id="stick" aria-label="Walk"><div id="knob"></div></div>
<button id="use" type="button">Use</button>
<button id="menubtn" type="button" aria-label="Menu">≡</button>

<div id="title" class="veil">
  <div class="inner">
    <h1>Tangle<span>.</span></h1>
    <p class="sub">A house of strange loops: paths that keep going forward and still end up where they started.</p>
    <div class="row">
      <button id="begin" type="button">Begin</button>
      <button id="fresh" type="button" class="quiet" hidden>Start over</button>
    </div>
    <p class="how" id="how"></p>
  </div>
</div>

<div id="menu" class="veil" hidden role="dialog" aria-modal="true" aria-labelledby="menu-title">
  <div class="card">
    <h2 id="menu-title">Paused</h2>
    <h3>Controls</h3>
    <div class="keys" id="keys"></div>
    <h3>Settings</h3>
    <div class="set">
      <label for="sens">Look speed</label><input id="sens" type="range" min="0.4" max="2.5" step="0.05" value="1">
      <label for="invert">Invert look up/down</label><input id="invert" type="checkbox">
      <label for="fov">Field of view</label><input id="fov" type="range" min="56" max="90" step="1" value="66">
      <label for="textsize">Text size</label><select id="textsize"><option value="0.9">Smaller</option><option value="1" selected>Normal</option><option value="1.2">Larger</option><option value="1.4">Largest</option></select>
      <label for="soundon">Sound</label><input id="soundon" type="checkbox" checked>
    </div>
    <div class="row">
      <button id="resume" type="button">Resume</button>
      <button id="restart" type="button" class="quiet">Start over</button>
    </div>
  </div>
</div>

<div id="panel" class="veil" hidden role="dialog" aria-modal="true" aria-labelledby="panel-title">
  <div class="card">
    <h2 id="panel-title"></h2>
    <h3>What just happened</h3><p id="panel-what"></p>
    <h3>Why it matters</h3><p id="panel-why"></p>
    <div class="row"><button id="panel-ok" type="button">Carry on</button></div>
  </div>
</div>
<script src="engine/strata-loader.js"></script>
<script src="engine/strata-kit.js"></script>
<script type="module" src="src/game.js"></script>
</body>
</html>
